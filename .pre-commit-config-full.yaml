# Full pre-commit configuration for comprehensive checks
# Use this for manual runs: pre-commit run --config .pre-commit-config-full.yaml --all-files

repos:
  # Rust-specific hooks (comprehensive)
  - repo: local
    hooks:
      - id: rust-fmt
        name: Rust formatter
        description: Run cargo fmt
        entry: bash -c 'cargo fmt --all -- --check'
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-clippy
        name: Rust linter
        description: Run cargo clippy
        entry: bash -c 'cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-check
        name: Rust check
        description: Run cargo check
        entry: bash -c 'cargo check --all-targets --all-features'
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-test
        name: Rust tests
        description: Run cargo test
        entry: bash -c 'cargo test --all-targets --all-features'
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-audit
        name: Rust security audit
        description: Run cargo audit
        entry: bash -c 'cargo audit || echo "cargo-audit not installed, skipping security audit"'
        language: system
        types: [rust]
        pass_filenames: false

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Remove trailing whitespace
        types: [text]

      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensure files end with newline
        types: [text]

      - id: check-yaml
        name: Check YAML syntax
        description: Validate YAML files
        types: [yaml]

      - id: check-toml
        name: Check TOML syntax
        description: Validate TOML files
        types: [toml]

      - id: check-json
        name: Check JSON syntax
        description: Validate JSON files
        types: [json]

      - id: check-added-large-files
        name: Check for large files
        description: Prevent large files from being committed
        args: [--maxkb=1000]

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Check for merge conflict markers
        types: [text]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        name: Markdown linter
        description: Lint markdown files
        types: [markdown]
        args: [--fix]

  # Playwright E2E tests
  - repo: local
    hooks:
      - id: playwright-e2e
        name: Playwright E2E tests
        description: Run Playwright end-to-end tests
        entry: bash -c 'if [ -f "package.json" ] && [ -d "node_modules" ]; then npm run test:e2e; else echo "Skipping Playwright tests - no package.json or node_modules found"; fi'
        language: system
        types: [rust]
        pass_filenames: false
        always_run: false

  # WASM-specific checks
  - repo: local
    hooks:
      - id: wasm-check
        name: WASM build check
        description: Check WASM compilation
        entry: bash -c 'cd examples/simple-flow && cargo check --target wasm32-unknown-unknown'
        language: system
        types: [rust]
        pass_filenames: false
        always_run: false

# Configuration
default_stages: [commit]
fail_fast: false
minimum_pre_commit_version: '3.0.0'

# Exclude certain files from hooks
exclude: |
  (?x)^(
    target/.*|
    pkg/.*|
    \.git/.*|
    node_modules/.*|
    \.cargo/.*|
    Cargo\.lock
  )$
