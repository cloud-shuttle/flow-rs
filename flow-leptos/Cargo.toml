[package]
name = "flow-rs-leptos"
description = "Leptos framework integration for Flow-RS"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["web-sys"]
debug = []
canvas2d = []
web-sys = []

[dependencies]
# Core dependencies
flow-rs-core = { version = "0.1.0-beta.1", path = "../flow-core", features = ["serde"] }
flow-rs-renderer = { version = "0.1.0-beta.1", path = "../flow-renderer" }
flow-rs-wasm = { version = "0.1.0-beta.1", path = "../flow-wasm" }

# Leptos ecosystem
leptos = { workspace = true }

# Web APIs
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }

# Utilities
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Required for logging
tracing = { version = "0.1" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
leptos = { workspace = true }
