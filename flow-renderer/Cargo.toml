[package]
name = "flow-rs-renderer"
description = "Rendering abstractions and implementations for Flow-RS"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["canvas2d"]
canvas2d = ["web-sys/CanvasRenderingContext2d", "web-sys/HtmlCanvasElement", "web-sys/ImageData", "web-sys/Window", "web-sys/Performance", "web-sys/Document"]
webgl2 = ["web-sys/WebGl2RenderingContext", "web-sys/WebGlBuffer"]
webgpu = ["wgpu", "bytemuck"]
debug = ["tracing"]

[dependencies]
# Core dependency
flow-rs-core = { version = "0.1.0-beta.1", path = "../flow-core" }

# Web APIs
wasm-bindgen = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }

# WebGPU support (optional)
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

# Utilities
thiserror = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Optional debugging
tracing = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
