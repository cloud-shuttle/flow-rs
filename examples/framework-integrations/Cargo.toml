[package]
name = "framework-integrations-example"
version = "0.1.0"
edition = "2021"
authors = ["Flow-RS Contributors"]

[workspace]
# This example is not part of the main workspace

[lib]
crate-type = ["cdylib"]

[dependencies]
flow-rs-core = { path = "../../flow-core" }
flow-rs-renderer = { path = "../../flow-renderer", features = ["canvas2d"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "HtmlCanvasElement", "Element",
    "HtmlInputElement", "HtmlButtonElement", "HtmlDivElement", "Performance"
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Framework-specific dependencies (commented out as they're not needed for the demo)
# leptos = { version = "0.6.15", features = ["csr"] }
# yew = { version = "0.21", features = ["csr"] }
# dioxus = { version = "0.5", features = ["web"] }
# sycamore = { version = "0.8", features = ["web"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
