[package]
name = "interactive-playground-example"
version = "0.1.0"
edition = "2021"
authors = ["Flow-RS Contributors"]

[workspace]
# This example is not part of the main workspace

[lib]
crate-type = ["cdylib"]

[dependencies]
flow-rs-core = { path = "../../flow-core" }
flow-rs-renderer = { path = "../../flow-renderer", features = ["canvas2d"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "HtmlCanvasElement", "Element",
    "HtmlInputElement", "HtmlButtonElement", "HtmlSelectElement",
    "HtmlDivElement", "MouseEvent", "EventTarget", "KeyboardEvent",
    "Performance", "Event", "FocusEvent"
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
