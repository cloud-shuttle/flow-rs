<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow-RS Advanced UX Demo</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }

        .advanced-ux-demo {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3em;
            font-weight: 300;
            text-align: center;
            margin: 0;
            padding: 30px 0;
        }

        .demo-container {
            position: relative;
            margin: 30px;
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.3);
        }

        .features-grid {
            margin: 0 30px;
        }

        .feature-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2) !important;
        }

        .feature-card h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
            font-weight: 600;
        }

        .feature-card ul {
            list-style: none;
            padding: 0;
        }

        .feature-card li {
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .workflow-demo {
            margin: 0 30px 30px 30px;
        }

        .workflow-demo h2 {
            font-size: 2.2em;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .workflow-demo h4 {
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .workflow-demo p {
            font-size: 0.9em;
            margin: 0;
        }

        .tips-section {
            margin: 0 30px 30px 30px;
        }

        .tips-section h3 {
            margin-bottom: 15px;
        }

        .tips-section ul {
            padding-left: 20px;
        }

        .tips-section li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        /* Context menu styling (embedded for demo) */
        .flow-context-menu {
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            padding: 6px 0;
            min-width: 180px;
            font-family: inherit;
            font-size: 14px;
            user-select: none;
            z-index: 10000;
        }

        .flow-context-menu .menu-item {
            padding: 8px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s ease;
        }

        .flow-context-menu .menu-item:hover:not(.disabled) {
            background: linear-gradient(135deg, #f0f8ff, #e6f3ff);
        }

        .flow-context-menu .menu-item.disabled {
            color: #999;
            cursor: default;
        }

        .flow-context-menu .menu-separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e0e0e0, transparent);
            margin: 6px 0;
        }

        .flow-context-menu .submenu::after {
            content: '▶';
            margin-left: 12px;
            opacity: 0.7;
        }

        .flow-context-menu .shortcut {
            color: #666;
            font-size: 12px;
            margin-left: 24px;
            opacity: 0.8;
        }

        /* Selection highlights */
        .node-selected {
            filter: drop-shadow(0 0 8px rgba(0, 123, 255, 0.6));
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .advanced-ux-demo {
                margin: 0;
                border-radius: 0;
            }

            h1 {
                font-size: 2em;
                padding: 20px 0;
            }

            .demo-container {
                margin: 20px;
            }

            .features-grid {
                grid-template-columns: 1fr;
                margin: 0 20px;
            }

            .workflow-demo {
                margin: 0 20px 20px 20px;
            }

            .workflow-demo div {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            .tips-section {
                margin: 0 20px 20px 20px;
            }
        }

        @media (max-width: 480px) {
            .workflow-demo div {
                grid-template-columns: 1fr !important;
            }

            h1 {
                font-size: 1.8em;
            }
        }

        /* Animation for feature cards */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feature-card {
            animation: fadeInUp 0.6s ease-out;
        }

        .feature-card:nth-child(1) { animation-delay: 0.1s; }
        .feature-card:nth-child(2) { animation-delay: 0.2s; }
        .feature-card:nth-child(3) { animation-delay: 0.3s; }
        .feature-card:nth-child(4) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div id="leptos"></div>
    <script type="module">
        import init, { AdvancedUxDemo } from './pkg/advanced_ux_demo.js';
        init().then(() => {
            leptos.mount(document.getElementById('leptos'), AdvancedUxDemo);
        });
    </script>
</body>
</html>
