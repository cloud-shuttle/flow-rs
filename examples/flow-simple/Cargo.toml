[package]
name = "simple-flow-example"
version = "0.1.0"
edition = "2021"
authors = ["Leptos Flow Contributors"]

[lib]
crate-type = ["cdylib"]

[dependencies]
flow-rs-core = { path = "../../flow-core" }
flow-rs-renderer = { path = "../../flow-renderer", features = ["canvas2d"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "HtmlElement", "HtmlCanvasElement", "MouseEvent", "Element", "DomRect"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "performance_tests"
path = "tests/performance_tests.rs"
